# One file for dev and the end-to-end test stack (tools/test_stack.sh). The
# test stack sets ENV_SUFFIX (container names), its own debug ports and its
# own env file, and starts only www, auth, catcher and relay: it shares dev's
# Syncthing relay (st-relay), since the router forwards only one port.
services:
  # The web front end (site/www, "Warm Paper"): the public site (www) and the
  # signed-in pages -- sign in, sign up, Casper's guide (app). Static pages;
  # /api/ is proxied to casper_service, so the browser talks to one origin.
  www:
    build:
      context: ./site/www
    container_name: casper-www${ENV_SUFFIX:-}
    restart: unless-stopped
    environment:
      APP_URL: ${PUBLIC_APP_URL:-https://dev-app.casperagent.dev}
      AUTH_URL: ${PUBLIC_AUTH_URL:-https://dev-auth.casperagent.dev}
      AGENTS_URL: ${PUBLIC_AGENTS_URL:-dev-auth.casperagent.dev/agents.md}
      DOWNLOAD_URL: ${PUBLIC_DOWNLOAD_URL:-https://dev-auth.casperagent.dev/download/casper/macos}
      WWW_URL: ${PUBLIC_WWW_URL:-https://dev-www.casperagent.dev}
      PAIR_SCHEME: ${PAIR_SCHEME:-casper-dev}
      AUTH_UPSTREAM: http://casper-auth${ENV_SUFFIX:-}:8100
    ports:
      - "127.0.0.1:${WWW_DEBUG_PORT:-8080}:8080"   # local-only, for debugging
    networks:
      - casper-net

  auth:
    build:
      context: ./casper_service
      dockerfile: Dockerfile
    container_name: casper-auth${ENV_SUFFIX:-}
    restart: unless-stopped
    env_file: ${AUTH_ENV_FILE:-.env}
    environment:
      # Agent onboarding (docs/product/scenarios/agent-onboarding.md): the
      # instructions served at /agents.md and the app at /download/...
      ONBOARDING_DIR: /app/onboarding
      DIST_DIR: /app/dist
    volumes:
      - auth_db:/data
      - ./onboarding:/app/onboarding:ro
      - ./dist:/app/dist:ro
    ports:
      - "127.0.0.1:${AUTH_DEBUG_PORT:-8100}:8100"   # local-only, for debugging
    networks:
      - casper-net

  # Casper's own catcher -- the catcher of last resort (docs/product/
  # scenarios/mirroring.md): holds, encrypted and without history, only the
  # changes a person's mirrors haven't received yet, for people with no
  # always-on friend. A stock Syncthing; casper_service configures it over
  # its REST API (CATCHER_URL/CATCHER_API_KEY), which is reachable only on
  # casper-net. Its sync port is published so owners' Macs can reach it
  # (CATCHER_ADDRESSES in .env lists the addresses they should use).
  catcher:
    image: syncthing/syncthing:2.1.5
    container_name: casper-catcher${ENV_SUFFIX:-}
    restart: unless-stopped
    hostname: casper-catcher${ENV_SUFFIX:-}
    environment:
      STGUIADDRESS: 0.0.0.0:8384
      STGUIAPIKEY: ${CATCHER_API_KEY:-}
    volumes:
      - catcher_data:/var/syncthing
    ports:
      - "${CATCHER_PORT:-22100}:22000/tcp"
      - "${CATCHER_PORT:-22100}:22000/udp"
    networks:
      - casper-net

  # Casper's own Syncthing relay, for mirror peers that can't reach each
  # other directly (different home networks, strict NATs). Private: it
  # doesn't join the public relay pool (-pools=""), so only devices Casper
  # tells about it use it. It relays end-to-end-encrypted TLS between
  # peers; it never sees file data. Reachable from the internet through the
  # home router (port 22067, forwarded by NAT-PMP from casper_service);
  # Tailscale Funnel can't carry relay sessions (it routes by TLS name).
  st-relay:
    image: syncthing/relaysrv:latest
    container_name: casper-st-relay
    restart: unless-stopped
    # -ext-address: what the relay tells peers to connect to for a session
    # -- just its port (":22067"): peers use the address they reached it by.
    command: ["-pools=", "-listen=:22067", "-status-srv=", "-keys=/var/strelaysrv", "-ext-address=${ST_RELAY_EXT_ADDRESS:-:22067}"]
    volumes:
      - st_relay_keys:/var/strelaysrv
    ports:
      # Published on the mini's network: the home router forwards this port
      # to it (casper_service keeps that open with NAT-PMP).
      - "22067:22067"
    networks:
      - casper-net

  relay:
    build:
      context: ./relay
      dockerfile: Dockerfile
    container_name: casper-relay${ENV_SUFFIX:-}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${RELAY_DEBUG_PORT:-8600}:8600"   # local-only, for debugging
    networks:
      - casper-net

networks:
  # Shared across the dev and prod environments (and cloudflared, which lives
  # in its own ~/casper-infra/ directory, outside either environment's git
  # checkout) -- externally created once (`docker network create
  # casper-shared`), not owned by this compose project's lifecycle, so
  # `docker compose down` here never risks recreating or orphaning it.
  casper-net:
    external: true
    name: casper-shared

volumes:
  auth_db:
  catcher_data:
  st_relay_keys:
