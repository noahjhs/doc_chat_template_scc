services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: casper-app
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./dist:/app/dist:ro
    ports:
      - "127.0.0.1:8501:8501"   # local-only, for debugging; not required for the tunnel
    depends_on:
      - auth
    networks:
      - casper-net

  auth:
    build:
      context: ./auth_service
      dockerfile: Dockerfile
    container_name: casper-auth
    restart: unless-stopped
    env_file: .env
    volumes:
      - auth_db:/data
    ports:
      - "127.0.0.1:8100:8100"   # local-only, for debugging
    networks:
      - casper-net

  relay:
    build:
      context: ./relay
      dockerfile: Dockerfile
    container_name: casper-relay
    restart: unless-stopped
    ports:
      - "127.0.0.1:8600:8600"   # local-only, for debugging
    networks:
      - casper-net

networks:
  # Shared across the dev and prod environments (and cloudflared, which lives
  # in its own ~/casper-infra/ directory, outside either environment's git
  # checkout) -- externally created once (`docker network create
  # casper-shared`), not owned by this compose project's lifecycle, so
  # `docker compose down` here never risks recreating or orphaning it.
  casper-net:
    external: true
    name: casper-shared

volumes:
  auth_db:
