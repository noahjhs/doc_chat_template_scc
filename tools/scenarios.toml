# Test scenarios for tools/scenario.py: personas, checkpoints, scenarios.
#
# A persona is one test person: their own VM, started from a snapshot, and
# their dev accounts -- `accounts` lists the names (shell-style patterns)
# that belong to them, so accounts made up during a walkthrough
# (noah_walkthrough) are cleared by the next reset too. Snapshots hold only what's local to a Mac (apps,
# Gmail/Telegram/Claude sign-ins) -- never anything tied to a Casper account.
# A checkpoint is a recipe: reset the persona's VM from its snapshot, delete
# their dev account, then replay steps to reach a known point. `extends`
# builds on another checkpoint. A scenario starts several checkpoints at once,
# e.g. both sides of an invite.
#
# Steps (see STEPS in scenario.py): name_mac <name>, quiet_apps <apps>, claude_token, install_casper,
# create_account, pair,
# connect_claude, publish_offering <GB>, chat_folder.

[deployments.dev]
auth_url = "https://dev-auth.casperagent.dev"
download_url = "https://dev-auth.casperagent.dev/download/casper/macos"
auth_domain = "dev-auth.casperagent.dev"
relay_domain = "dev-relay.casperagent.dev"

[deployments.test]  # the end-to-end test stack (tools/test_stack.sh); --env test
auth_url = "https://test-auth.casperagent.dev"
download_url = "https://test-auth.casperagent.dev/download/casper/macos"
auth_domain = "test-auth.casperagent.dev"
relay_domain = "test-relay.casperagent.dev"

[snapshots]
# Local-only starting points (Tart VMs on this Mac).
noah-base = "Chrome (default), Gmail and Telegram signed in, realistic Documents; no sleep/lock or update nags; copy/paste. No AI agent."
riley-base = "Claude Code like noah-base-claude, but signed in to Riley's own Telegram and Gmail."
noah-base-claude = "noah-base plus Claude Code, installed and signed in."

[personas.riley]
vm = "riley-mac"
snapshot = "riley-base"
username = "riley"
accounts = ["riley", "riley_*", "riley-*"]  # every reset deletes these (names made up during a walkthrough too)

[personas.riley-headless]  # Riley without a VM: a headless Mac on the mini, and a Claude with only Casper's tools
headless = true
username = "riley"
accounts = ["riley", "riley_*", "riley-*"]

[personas.noah]  # uses the Principal's own Telegram and Gmail (noah-base)
vm = "noah-mac"
snapshot = "noah-base"
username = "noah"
accounts = ["noah", "noah_*", "noah-*"]

[checkpoints.riley-before-publish]
persona = "riley"
about = "Riley: Casper installed and connected, Claude connected to Casper; nothing offered yet."
steps = ["name_mac Riley's MacBook", "claude_token", "install_casper", "create_account", "pair", "connect_claude", "chat_folder"]

[checkpoints.riley-before-invite]
extends = "riley-before-publish"
about = "Riley: offers 20 GB of mirror space on their Mac; no invites yet."
steps = ["publish_offering 20"]

[checkpoints.noah-fresh]
persona = "noah"
about = "Noah: a Mac that's never seen Casper, and no Casper account."
steps = ["name_mac Noah's MacBook Air", "quiet_apps Telegram Safari System_Settings"]

[checkpoints.riley-headless-before-invite]
persona = "riley-headless"
about = "Riley, headless: an always-on Mac on the mini offering 20 GB of mirror space; no invites yet."
steps = ["name_mac Riley's MacBook", "create_account", "pair", "publish_offering 20"]

[scenarios.publish]
about = "Riley offers space and invites Noah, from scratch."
checkpoints = ["riley-before-publish", "noah-fresh"]
next = """
In riley-mac: open Terminal, run `cd ~/chat && claude`, and say
"Offer space to friends, and invite my friend Noah to Mutual Aid."
Then follow the invitation in noah-mac."""

[scenarios.invite]
about = "Riley already offers space; Riley invites Noah, who sets up with Casper's guide."
checkpoints = ["riley-before-invite", "noah-fresh"]
next = """
In riley-mac: open Terminal, run `cd ~/chat && claude`, and say
"Invite my friend Noah to Mutual Aid."
Then follow the invitation in noah-mac."""

[scenarios.invite-headless]
about = "Like invite, with one VM: Riley is headless (for automated runs, tools/e2e.sh)."
checkpoints = ["riley-headless-before-invite", "noah-fresh"]
next = """
Riley: tools/scenario.py ask riley-headless "Invite my friend Noah to Mutual Aid."
Then follow the invitation in noah-mac."""
