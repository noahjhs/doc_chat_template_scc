[project]
name = "casper-harness"
version = "0.1.0"
description = "CLI + library test harness for Casper's backend (auth_service) -- no GUI in the loop."
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "rich>=13",
    "pyyaml>=6",
]

[project.scripts]
harness = "harness.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["harness*"]
