[project]
name = "casper-harness"
version = "0.1.0"
description = "CLI + library test harness for Casper's backend (casper_service) -- no GUI in the loop."
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "rich>=13",
    "pyyaml>=6",
    "keyring>=25",
    # Touch ID/password gating for a saved login password (see cli.py's
    # _authenticate_device_owner) -- macOS-only, hence the platform marker;
    # cli.py itself tolerates this not being installed at all (degrades to
    # no biometric gate, same as before this was added).
    "pyobjc-framework-LocalAuthentication>=10; sys_platform == 'darwin'",
]

[project.scripts]
harness = "harness.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["harness*"]
