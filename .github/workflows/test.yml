name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r casper_service/requirements.txt
          pip install -e harness/
          pip install pytest pyflakes
      - name: pyflakes
        run: pyflakes casper_service utils pages casper_app.py harness/harness tests
      - name: pytest
        run: pytest tests/ -v

  harness-macos:
    # macos-latest, not ubuntu -- harness's own keyring dependency uses a
    # real macOS Keychain backend there (a no-op/different backend on
    # Linux), and pyobjc-framework-LocalAuthentication (Touch ID gating,
    # see harness/harness/cli.py's _authenticate_device_owner) is a
    # platform-conditional dependency that only even installs on darwin --
    # the ubuntu `python` job above never exercises either at all. Runs
    # only the harness-specific test files (the rest of tests/ needs no
    # macOS-specific behavior and already runs on the ubuntu job).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r casper_service/requirements.txt
          pip install -e harness/
          pip install pytest
      - name: pytest (harness)
        run: pytest tests/test_harness_cli.py tests/test_harness_flows.py -v

  go:
    # macos-latest, not ubuntu -- agent/ has Darwin-tagged build-constrained
    # files (statusicon_darwin.go, workspace_darwin.go, etc.) with no Linux
    # fallback, since this project doesn't target Linux at all; running on
    # the platform it actually builds for is simpler than fighting build
    # tags on a runner nothing here is meant to run on.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
      - name: Stub the embedded domain files
        # internal/config/domain.go go:embeds these -- build/build_go_macos.sh
        # normally stages them from the (gitignored, instance-specific)
        # repo-root *_server.txt files, but no build/deploy happens here and
        # no test reads the actual embedded value, so empty placeholders are
        # enough to satisfy the embed directive and let the package compile.
        run: |
          mkdir -p agent/internal/config/embedded
          : > agent/internal/config/embedded/app_server.txt
          : > agent/internal/config/embedded/auth_server.txt
          : > agent/internal/config/embedded/relay_server.txt
      - name: Build, vet, format-check, test agent
        working-directory: agent
        run: |
          go build ./...
          go vet ./...
          test -z "$(gofmt -l .)"
          go test ./...
      - name: Build, vet, format-check, test relay
        working-directory: relay
        run: |
          go build ./...
          go vet ./...
          test -z "$(gofmt -l .)"
          go test ./...
