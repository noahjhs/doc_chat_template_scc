server {
    listen 8080;
    root /usr/share/nginx/html;
    # Docker's DNS, re-resolved per request, so nginx starts even when
    # Casper's service is briefly down.
    resolver 127.0.0.11 valid=10s;
    set $auth ${AUTH_UPSTREAM};

    # Casper's service, same-origin for the signed-in pages (no CORS).
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $auth;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 200s;
    }
    # /download, /invite, /signin, /signup, /guide are pretty URLs for *.html.
    location / { try_files $uri $uri.html $uri/ =404; }
    location ~* \.(html|js|css)$ { add_header Cache-Control "no-cache"; }
}
