<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/favicon.svg"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600;1,9..144,300&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet"><link rel="stylesheet" href="/styles.css"><title>Guide — Casper</title></head><body><div class="wrap">
<nav><a class="logo" href="${WWW_URL}/"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3C9.4 3 5 8 5 14.5V28l3.6-2.6L12 28l4-2.8L20 28l3.4-2.6L27 28V14.5C27 8 22.6 3 16 3z" fill="#2b1d14"/><circle cx="12.5" cy="14" r="1.8" fill="#f6efe4"/><circle cx="19.5" cy="14" r="1.8" fill="#f6efe4"/></svg> Casper</a><div class="links"><a href="#" id="signout">Sign out</a></div></nav>
<section class="chat">
<div class="eyebrow">Casper's guide</div>
<div id="log" class="log"></div>
<div id="progress" class="note hide"></div>
<div id="choices" class="choices"></div>
<form id="f" class="composer"><input id="t" placeholder="Message Casper's guide" autocomplete="off"><button class="btn" type="submit">Send</button></form>
</section>
<footer><span>Casper — held by friends, read by no one.</span><span><a href="${WWW_URL}/">Home</a> · <a href="/guide">Guide</a> · Early alpha · macOS</span></footer></div><script src="/app.js"></script><script>
if (!Casper.session()) location.replace("/signin?next=" + encodeURIComponent(location.pathname + location.search));
const $ = id => document.getElementById(id);
const GHOST = document.querySelector(".logo svg").outerHTML;
let busy = false, rendered = -1;
const invite = Casper.param("invite");

function bubble(role, html, extra = "") {
  const d = document.createElement("div"); d.className = "msg " + role + " " + extra;
  d.innerHTML = (role === "assistant" ? '<span class="av">' + GHOST + "</span>" : "") + '<div class="body">' + html + "</div>";
  $("log").insertBefore(d, dotsEl);  // the thinking dots stay last
  window.scrollTo(0, document.body.scrollHeight); return d;
}

// One "thinking" bubble, however many reasons there are to show it (a reply
// being written, Casper waiting on their Mac): each reason holds it on.
const dotsFor = new Set();
let dotsEl = null;
function dots(reason, on) {
  if (on) dotsFor.add(reason); else dotsFor.delete(reason);
  if (dotsFor.size && !dotsEl) dotsEl = bubble("assistant", "<span></span><span></span><span></span>", "thinking");
  if (!dotsFor.size && dotsEl) { dotsEl.remove(); dotsEl = null; }
}

// Buttons replace typing: while there are choices, there's no text box.
function setChoices(list) {
  $("choices").innerHTML = "";
  const has = (list || []).length > 0;
  $("f").classList.toggle("hide", has);
  // The folder step (its buttons include the folder chooser): sizing the folder
  // picked makes macOS ask whether Casper may see it. Say so before it pops up.
  const folderStep = (list || []).some(c => typeof c === "object" && c.action === "choose_folder");
  (list || []).forEach((c, i) => {
    const b = document.createElement("button"); b.className = i === 0 ? "btn" : "btn ghost";
    b.innerText = typeof c === "string" ? c : c.label;
    b.onclick = () => {
      // Sizing a folder makes macOS ask whether Casper may see it: say so before it pops up.
      if (folderStep && typeof c === "string")
        setTimeout(() => { if (busy) bubble("assistant", "If your Mac asks whether Casper can see " + c + ", choose Allow.", "note-bubble"); }, 3000);
      typeof c === "string" ? send(c) : act(c.action);
    };
    $("choices").appendChild(b);
  });
  if (!has) $("t").focus();
}

// The server's history is the truth: render it (any tab, any source).
async function refresh() {
  let msgs;
  try { msgs = (await Casper.api("/guide/history")).messages; } catch (e) { if (e.status === 401) location.replace("/signin"); return; }
  if (msgs.length === rendered) return;
  rendered = msgs.length; $("log").innerHTML = ""; dotsEl = null;
  // Arriving from an invitation: the guide's first line is about the invite.
  if (!msgs.length && !invite) bubble("assistant", Casper.render("I'm Casper's guide. Keep your files safe, or offer space to friends?"));
  msgs.forEach(m => bubble(m.role, Casper.render(m.text)));
  const reasons = [...dotsFor]; dotsFor.clear(); reasons.forEach(r => dots(r, true));
  const last = msgs[msgs.length - 1];
  setChoices(last && last.role === "assistant" ? last.choices : []);
  // A button in the message itself (Download Casper) is the call to action too.
  if (last && last.role === "assistant" && last.text.includes(Casper.DOWNLOAD_URL)) $("f").classList.add("hide");
}

// Casper is waiting on something on their Mac (its dialog, the folder panel):
// the guide shows it's waiting, and there's nothing to type.
function waiting(on) {
  if (on && !dotsFor.has("mac")) { $("f").classList.add("hide"); $("choices").innerHTML = ""; }
  dots("mac", on);
}

async function send(text, { hidden = false } = {}) {
  if (busy || !text.trim()) return; busy = true; setChoices([]); $("f").classList.add("hide");
  if (!hidden) bubble("user", Casper.render(text));
  dots("reply", true);
  try { await Casper.api("/guide/message", { method: "POST", body: { text, event: hidden } }); }
  catch (e) { dots("reply", false); bubble("assistant", Casper.render(e.message)); busy = false; $("f").classList.remove("hide"); return; }
  dots("reply", false); busy = false; rendered = -1; await refresh();
}

// A button that does something on their Mac (e.g. open the folder chooser).
async function act(action) {
  setChoices([]); $("f").classList.add("hide");
  try {
    const r = await Casper.api("/guide/action", { method: "POST", body: { action } });
    if (r.opened) waiting(true);
    else { bubble("assistant", Casper.render(r.message)); rendered = -1; await refresh(); }
  } catch (e) { bubble("assistant", Casper.render(e.message)); }
}

// Casper's state moved on (Mac connected, Mirror clicked...): the guide
// carries on by itself -- whichever tab notices first; the rest just render.
async function tick() {
  if (busy) return;
  try {
    const st = await Casper.api("/guide/state");
    if (st.count !== rendered) await refresh();
    waiting(st.waiting);
    $("progress").classList.toggle("hide", !st.progress); $("progress").innerText = st.progress || "";
    if (st.due) {
      busy = true; dots("reply", true);
      try { await Casper.api("/guide/continue", { method: "POST" }); } finally { dots("reply", false); busy = false; }
      rendered = -1; await refresh();
    }
  } catch (e) { /* offline for a moment: try again next tick */ }
}

// Chrome blocks Casper's download as "suspicious" until it's kept. If the Mac still
// hasn't connected a little after Download was clicked, say what to do, once.
let hinted = false;
document.addEventListener("click", ev => {
  const a = ev.target.closest("a.btn.inline");
  if (!a || hinted) return;
  hinted = true;
  setTimeout(async () => {
    try { if ((await Casper.api("/guide/state")).stage !== "install") return; } catch (e) { return; }
    bubble("assistant", "Chrome blocked it? Click the download arrow in Chrome's toolbar, then Download suspicious file.", "note-bubble");
  }, 5000);
});

$("f").addEventListener("submit", ev => { ev.preventDefault(); const t = $("t").value; $("t").value = ""; send(t); });
$("signout").onclick = ev => { ev.preventDefault(); Casper.signOut(); location.href = "/signin"; };
// Every guide tab stays live (the server takes turns one at a time). Sign-in
// from the Mac app asks whether one is open, so it can leave the guide to it
// instead of opening another.
const tabs = new BroadcastChannel("casper-guide");
tabs.onmessage = ev => { if (ev.data === "anyone?") tabs.postMessage("guide-open"); };
(async () => {
  await refresh();
  if (invite) {
    history.replaceState(null, "", location.pathname);
    const msgs = (await Casper.api("/guide/history")).messages;
    // The invite code goes to the guide as news (not shown as something they said).
    if (!msgs.length) await send("They arrived from a friend's invitation. Their invite code is " + invite + ".", { hidden: true });
  }
  setInterval(tick, 3000);
})();
</script></body></html>
